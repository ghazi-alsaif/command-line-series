name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/readme-covers/**"
      - "fonts/IBMPlexSansArabic-Regular.ttf"
      - "fonts/IBMPlexSansArabic-SemiBold.ttf"
      - "fonts/NotoKufiArabic-Bold.ttf"
      - "fonts/JetBrainsMono-Regular.ttf"
      - "VERSION"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Select published book assets
        id: book-source
        shell: bash
        run: |
          set -euo pipefail
          requested_version=$(tr -d '[:space:]' < VERSION)
          releases_json=$(mktemp)
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" \
            --output "$releases_json"
          published_version=$(
            python3 - "$releases_json" "$requested_version" <<'PY'
          import json
          import re
          import sys

          source, requested = sys.argv[1:]
          required = {
              "1-linux-ar.pdf",
              "2-macos-ar.pdf",
              "3-windows-ar.pdf",
              "4-bsd-ar.pdf",
              "5-workbook-ar.pdf",
              "6-unix-story-ar.pdf",
              "7-automation-ar.pdf",
              "8-server-ar.pdf",
              "9-network-ar.pdf",
              "10-projects-ar.pdf",
          }
          with open(source, encoding="utf-8") as stream:
              releases = json.load(stream)
          version_pattern = re.compile(r"^[0-9]+(?:\.[0-9]+){1,2}$")
          def version_key(version):
              parts = tuple(int(part) for part in version.split("."))
              return parts + (0,) * (3 - len(parts))
          requested_key = version_key(requested)
          complete = {}
          for release in releases:
              tag = release.get("tag_name", "")
              if release.get("draft") or release.get("prerelease"):
                  continue
              assets = {asset.get("name") for asset in release.get("assets", [])}
              if required <= assets:
                  version = tag.removeprefix("v")
                  if version_pattern.fullmatch(version):
                      complete[version] = version_key(version)
          if requested in complete:
              print(requested)
          else:
              earlier = [
                  (key, version)
                  for version, key in complete.items()
                  if key < requested_key
              ]
              if earlier:
                  print(max(earlier)[1])
          PY
          )
          if [ -z "$published_version" ]; then
            echo "::error::Release v$requested_version does not have the required PDFs, and no earlier published release with all ten PDFs was found."
            exit 1
          fi
          if [ "$published_version" = "$requested_version" ]; then
            echo "Using book assets from Release v$requested_version."
          else
            echo "::warning::Release v$requested_version does not exist or lacks all ten PDF assets; Pages will use the latest earlier complete published Release v$published_version."
          fi
          echo "version=$published_version" >> "$GITHUB_OUTPUT"
          echo "base=https://github.com/ghazi-alsaif/command-line-series/releases/download/v$published_version" >> "$GITHUB_OUTPUT"

      - name: Restore rendered reader pages
        id: reader-cache
        uses: actions/cache@v6
        with:
          path: _reader-cache
          key: reader-pages-v${{ steps.book-source.outputs.version }}-r132-q88

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/covers _site/assets/fonts _site/vendor
          cp site/index.html site/styles.css site/script.js site/reader.js _site/
          cp docs/readme-covers/*.png _site/assets/covers/
          cp fonts/IBMPlexSansArabic-Regular.ttf _site/assets/fonts/
          cp fonts/IBMPlexSansArabic-SemiBold.ttf _site/assets/fonts/
          cp fonts/NotoKufiArabic-Bold.ttf _site/assets/fonts/
          cp fonts/JetBrainsMono-Regular.ttf _site/assets/fonts/
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.mjs" \
            --output "_site/vendor/pdf.mjs"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.worker.mjs" \
            --output "_site/vendor/pdf.worker.mjs"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/LICENSE" \
            --output "_site/vendor/PDFJS-LICENSE"
          (
            cd _site/vendor
            echo "d7f44e075a8fa47ac165362d404de2dabf61f64f3d98c9180162c5f71f54980a  pdf.mjs" | sha256sum --check
            echo "f9ed6a050771ad74c228a1cbfc8edb3271249f2e2efa29ed4692468ecb001733  pdf.worker.mjs" | sha256sum --check
            echo "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594  PDFJS-LICENSE" | sha256sum --check
          )
          mkdir -p _site/books
          release_base="${{ steps.book-source.outputs.base }}"
          for asset in \
            1-linux-ar.pdf \
            2-macos-ar.pdf \
            3-windows-ar.pdf \
            4-bsd-ar.pdf \
            5-workbook-ar.pdf \
            6-unix-story-ar.pdf \
            7-automation-ar.pdf \
            8-server-ar.pdf \
            9-network-ar.pdf \
            10-projects-ar.pdf
          do
            curl --fail --location --retry 30 --retry-all-errors --retry-delay 10 \
              "$release_base/$asset" \
              --output "_site/books/$asset"
          done
          if [ "${{ steps.reader-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            sudo apt-get install --yes poppler-utils
            mkdir -p _reader-cache
            for pdf in _site/books/*.pdf
            do
              book=$(basename "$pdf" -ar.pdf)
              mkdir -p "_reader-cache/$book"
              pdftoppm -jpeg -r 130 -jpegopt quality=88,optimize=y,progressive=y \
                "$pdf" "_reader-cache/$book/page"
            done
          fi
          mkdir -p _site/reader-pages
          cp -a _reader-cache/. _site/reader-pages/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
