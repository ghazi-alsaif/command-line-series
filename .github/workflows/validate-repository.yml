name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate publication assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install publication validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils poppler-utils qpdf unzip

      - name: Install the pinned Typst release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          typst_version=$(tr -d '[:space:]' < TYPST_VERSION)
          asset_name="typst-x86_64-unknown-linux-musl.tar.xz"
          release_json=$(mktemp)
          archive=$(mktemp --suffix=.tar.xz)
          extract_dir=$(mktemp -d)

          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/typst/typst/releases/tags/v$typst_version" \
            --output "$release_json"

          mapfile -t asset_metadata < <(
            python3 - "$release_json" "$asset_name" <<'PY'
          import json
          import sys

          release_path, wanted_name = sys.argv[1:]
          with open(release_path, encoding="utf-8") as source:
              release = json.load(source)
          for asset in release.get("assets", []):
              if asset.get("name") == wanted_name:
                  print(asset.get("browser_download_url", ""))
                  print(asset.get("digest", ""))
                  break
          else:
              raise SystemExit(f"Official Typst release is missing {wanted_name}")
          PY
          )

          download_url=${asset_metadata[0]:-}
          asset_digest=${asset_metadata[1]:-}
          if [[ ! "$asset_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The official Typst release metadata has no SHA-256 digest for $asset_name."
            exit 1
          fi

          curl --fail --silent --show-error --location --retry 3 \
            "$download_url" --output "$archive"
          printf '%s  %s\n' "${asset_digest#sha256:}" "$archive" |
            sha256sum --check --status
          echo "Verified $asset_name against the SHA-256 digest published by the official Typst release."

          tar --extract --xz --file "$archive" --directory "$extract_dir"
          typst_binary=$(find "$extract_dir" -type f -name typst -perm -u+x -print -quit)
          test -n "$typst_binary"
          sudo install -m 0755 "$typst_binary" /usr/local/bin/typst

          installed_version=$(typst --version | awk '{print $2}')
          test "$installed_version" = "$typst_version"

      - name: Reject obsolete non-historical license references
        run: python3 tools/check_license_history.py

      - name: Validate required files and README references
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            README.en.md
            LICENSE
            LICENSES/README.md
            LICENSES/CC-BY-SA-4.0.txt
            LICENSES/MIT.txt
            LICENSES/OFL-1.1-FONTS.txt
            LICENSES/DEJAVU-FONTS.txt
            THIRD_PARTY_NOTICES.md
            ATTRIBUTION.md
            TRANSLATION-GUIDE.md
            OFFICIAL-EDITIONS.md
            BRAND-POLICY.md
            COVER-PERMISSION.md
            TRADEMARKS.md
            CONTRIBUTING.md
            CONTRIBUTING.en.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            GOVERNANCE.md
            SUCCESSION.md
            docs/COVER-RIGHTS-AUDIT.md
            docs/PRINTING.md
            docs/PDF-ACCESSIBILITY.md
            docs/PUBLISHING-CHECKLIST.md
            docs/RELEASE-AUDIT-v2.0.0.md
            docs/audits/book-8-adversarial-v2.0.0.md
            docs/audits/book-9-adversarial-v2.0.0.md
            docs/audits/book-10-adversarial-v2.0.0.md
            tools/make_print_cover.sh
            tools/print_cover_spread.typ
            tools/release_check.sh
            VERSION
            TYPST_VERSION
            site/index.html
            site/styles.css
            site/script.js
            site/reader.js
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

          for cover in 1-linux 2-macos 3-windows 4-bsd 5-workbook 6-unix-story 7-automation 8-server 9-network 10-projects; do
            test -s "docs/readme-covers/$cover.png"
          done

          python - <<'PY'
          from pathlib import Path
          import re

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", version):
              raise SystemExit(f"Invalid project version: {version!r}")
          typst_version = Path("TYPST_VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", typst_version):
              raise SystemExit(f"Invalid Typst version: {typst_version!r}")

          readme = Path("README.md").read_text(encoding="utf-8")
          if f"**{version}**" not in readme:
              raise SystemExit("README does not show the project version")
          if "https://ghazi-alsaif.github.io/command-line-series/" not in readme:
              raise SystemExit("README does not link to the project website")
          required_phrases = {
              "README.md": ("CC BY-SA 4.0", "نصوصها الأساسية وُلّدت باستخدام أدوات الذكاء الاصطناعي"),
              "README.en.md": ("CC BY-SA 4.0", "All book drafts and core prose were generated"),
              "site/index.html": (f"الإصدار {version}", "نصوصها الأساسية وُلّدت باستخدام أدوات الذكاء الاصطناعي"),
              "LICENSES/README.md": (
                  "حدود العرض", "MIT", "books/9-network/ar/**",
                  "books/10-projects/ar/**", "books/*/ar/assets/cover*.png",
              ),
              "COVER-PERMISSION.md": ("النسخة الرسمية غير المعدلة", "ككتاب كامل"),
              "TRANSLATION-GUIDE.md": ("ترجمة مجتمعية غير رسمية",),
              "tools/print_cover_spread.typ": (
                  "غازي السيف — أبو هيثم",
                  "مِن الصِّفر إلى الجَذر",
                  "ماك من الطرفية",
                  "مِن الصِّفر إلى المسؤول",
                  "مِن الصِّفر إلى العِفريت",
                  "الطرفيّةُ بالممارسة",
                  "رُوحٌ في الآلة",
                  "مِن الأمر إلى الأتمتة",
                  "الخادمُ الذي لا ينام",
                  "الشبكةُ من الطرفية",
                  "10+ مشاريع كبرى من الطرفية",
              ),
              "docs/PRINTING.md": (
                  "لا يجوز تخمينه",
                  "اسم الكتاب",
                  "غازي السيف — أبو هيثم",
                  "6.5 mm",
                  "أمامي + كعب + خلفي",
                  "عند أسفل الكعب",
                  "bottom-to-top",
              ),
          }
          for name, phrases in required_phrases.items():
              text = Path(name).read_text(encoding="utf-8")
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f"Missing required phrase in {name}: {phrase}")
          current_books = sorted(Path("books").glob("*/ar"))
          if len(current_books) != 10:
              raise SystemExit(f"Expected ten book sources; found {len(current_books)}")
          for book_dir in current_books:
              for relative in ("main.typ", "frontmatter/title-page.typ", "frontmatter/colophon.typ"):
                  path = book_dir / relative
                  text = path.read_text(encoding="utf-8")
                  for marker in ("مسودة أولى", "مسودة تطويرية", "غير منشورة"):
                      if marker in text:
                          raise SystemExit(f"Draft marker remains in {path}: {marker}")

          private_contacts = (
              re.compile(r"eng\.ghazi\\?@icloud\.com", re.IGNORECASE),
              re.compile(r"al\.saif1990@gmail\.com", re.IGNORECASE),
          )
          text_suffixes = {".css", ".html", ".js", ".md", ".py", ".sh", ".txt", ".typ", ".yaml", ".yml"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"LICENSE", "Makefile"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              if any(pattern.search(text) for pattern in private_contacts):
                  raise SystemExit(f"Private contact remains in public source: {path}")

          expected = [
              "1-linux-ar.pdf",
              "1-linux-ar-interior.pdf",
              "1-linux-ar.epub",
              "2-macos-ar.pdf",
              "2-macos-ar-interior.pdf",
              "2-macos-ar.epub",
              "3-windows-ar.pdf",
              "3-windows-ar-interior.pdf",
              "3-windows-ar.epub",
              "4-bsd-ar.pdf",
              "4-bsd-ar-interior.pdf",
              "4-bsd-ar.epub",
              "5-workbook-ar.pdf",
              "5-workbook-ar-interior.pdf",
              "5-workbook-ar.epub",
              "6-unix-story-ar.pdf",
              "6-unix-story-ar-interior.pdf",
              "6-unix-story-ar.epub",
              "7-automation-ar.pdf",
              "7-automation-ar-interior.pdf",
              "7-automation-ar.epub",
              "8-server-ar.pdf",
              "8-server-ar-interior.pdf",
              "8-server-ar.epub",
              "9-network-ar.pdf",
              "9-network-ar-interior.pdf",
              "9-network-ar.epub",
              "10-projects-ar.pdf",
              "10-projects-ar-interior.pdf",
              "10-projects-ar.epub",
          ]

          for asset in expected:
              if asset not in readme:
                  raise SystemExit(f"Missing release asset reference: {asset}")

          for target in re.findall(r"\]\(([^)]+)\)", readme):
              if target.startswith(("http://", "https://", "#", "mailto:")):
                  continue
              path = target.split("#", 1)[0].split("?", 1)[0]
              if path and not Path(path).exists():
                  raise SystemExit(f"Missing local README target: {path}")
          PY

      - name: Run source checks
        run: make check

      - name: Build digital PDFs
        run: make digital

      - name: Build EPUB
        run: make epub

      - name: Build print interiors
        run: make print-interiors

      - name: Validate release assets
        run: make release-check

      - name: Check PDF structure fonts and page metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digital_pdfs=(build/*-ar.pdf)
          interior_pdfs=(build/print/*-interior.pdf)
          if [ "${#digital_pdfs[@]}" -ne 10 ]; then
            echo "::error::Expected ten digital PDFs; found ${#digital_pdfs[@]}."
            exit 1
          fi
          if [ "${#interior_pdfs[@]}" -ne 10 ]; then
            echo "::error::Expected ten print-interior PDFs; found ${#interior_pdfs[@]}."
            exit 1
          fi
          for pdf in "${digital_pdfs[@]}" "${interior_pdfs[@]}"; do
            pdfinfo "$pdf" | grep -Eq '^Pages:[[:space:]]+[1-9][0-9]*$'
            qpdf --check "$pdf"
            font_report=$(mktemp)
            pdffonts "$pdf" > "$font_report"
            if ! python3 - "$font_report" <<'PY'
          import sys

          report = sys.argv[1]
          lines = open(report, encoding="utf-8").read().splitlines()[2:]
          if not lines:
              raise SystemExit(1)
          for line in lines:
              fields = line.split()
              # حقول النهاية ثابتة: emb, sub, uni, object, ID؛ أما type فقد
              # يكون كلمتين أو ثلاثًا مثل "CID Type 0C".
              if len(fields) < 5 or fields[-5] != "yes" or fields[-3] != "yes":
                  raise SystemExit(1)
          PY
            then
              echo "::error::A font is missing, not embedded, or lacks a Unicode map in $pdf."
              exit 1
            fi
          done

      - name: Check EPUB archive and XML
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          epubs=(build/*-ar.epub)
          if [ "${#epubs[@]}" -ne 10 ]; then
            echo "::error::Expected ten EPUB files; found ${#epubs[@]}."
            exit 1
          fi
          epub_root=$(mktemp -d)
          for epub in "${epubs[@]}"; do
            epub_dir="$epub_root/$(basename "$epub" .epub)"
            mkdir -p "$epub_dir"
            unzip -t "$epub"
            unzip -q "$epub" -d "$epub_dir"
            mapfile -d '' xml_files < <(
              find "$epub_dir" -type f \
                \( -name '*.xml' -o -name '*.xhtml' -o -name '*.opf' -o -name '*.ncx' \) \
                -print0
            )
            test "${#xml_files[@]}" -gt 0
            xmllint --noout "${xml_files[@]}"
          done
